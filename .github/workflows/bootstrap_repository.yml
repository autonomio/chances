name: Bootstrap Repository

on:
  workflow_dispatch:
    inputs:
      confirm_seed_repository:
        description: Exact owner/repository of a fresh template seed. Existing products are rejected.
        required: true
        type: string
      package_name:
        description: Optional Python import package name. Defaults to repository slug converted to snake_case.
        required: false
        type: string

# Serialize every bootstrap run into a single lane. Unlike the pr_checks
# workflows (which cancel superseded runs because only the latest PR push
# matters), an in-progress bootstrap is never cancelled: it may be partway
# through creation of its specialization PR, and interrupting it
# would leave a half-applied branch. A queued dispatch rejects a repository
# that was already specialized. No automatic push trigger exists.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    name: Bootstrap Repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Guard fresh template seed and explicit repository dispatch
        env:
          REPOSITORY: ${{ github.repository }}
          CONFIRMED_REPOSITORY: ${{ inputs.confirm_seed_repository }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          repository = os.environ['REPOSITORY']
          if os.environ['CONFIRMED_REPOSITORY'] != repository:
              raise SystemExit('Bootstrap requires confirmation of this exact repository.')
          if os.environ['DISPATCH_REF'] != 'refs/heads/master':
              raise SystemExit('Bootstrap is dispatched from master only.')
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']['name']
          if repository.casefold() == 'autonomio/chances' or project != 'new-repository-template':
              raise SystemExit('Bootstrap refuses an existing product, including Chances.')
          if not Path('new_repository_template').is_dir() or Path('chances').exists():
              raise SystemExit('Bootstrap requires the untouched template seed package.')
          PY

      - name: Install bootstrap dependencies
        run: python -m pip install --require-hashes -r requirements/ci/gate-tools.txt

      - name: Rewrite repository-specific files
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          args=(--repo-name "${{ github.event.repository.name }}" --owner "${{ github.repository_owner }}" --files-only --codeql supported)
          if [ -n "$PACKAGE_NAME" ]; then
            args+=(--package-name "$PACKAGE_NAME")
          fi
          python governance/bootstrap_repository.py "${args[@]}"

      - name: Open bootstrap PR for activation review
        id: bootstrap_pr
        env:
          GH_TOKEN: ${{ secrets.REPO_BOOTSTRAP_TOKEN }}
          BOOTSTRAP_BRANCH: bootstrap/repository-law-${{ github.run_id }}
          BOOTSTRAP_TITLE: "chore: bootstrap repository law"
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .; then
            echo "No repository bootstrap file changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::REPO_BOOTSTRAP_TOKEN is required so bootstrap can create a PR and trigger PR checks. Review and live activation remain separate."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bootstrap repository law"
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=$AUTH" push origin "HEAD:${BOOTSTRAP_BRANCH}"

          gh label create slice \
            --repo "$REPOSITORY" \
            --color "5319e7" \
            --description "Mechanically scoped repository slice" \
            --force

          python - <<'PY' > bootstrap_issue.md
          from pathlib import Path

          import yaml

          def blockquote(value: str) -> str | None:
              collected: list[str] = []
              started = False
              for line in value.split('\n'):
                  if not started:
                      if line.startswith('> **Significance.**'):
                          collected.append(line)
                          started = True
                  elif line.startswith('>'):
                      collected.append(line)
                  else:
                      break
              return '\n'.join(collected) if collected else None

          template = yaml.safe_load(Path('.github/ISSUE_TEMPLATE/slice.yml').read_text())
          blocks: list[str] = []
          for item in template.get('body', []):
              attrs = item.get('attributes', {}) if isinstance(item, dict) else {}
              value = attrs.get('value') if isinstance(attrs, dict) else None
              if isinstance(value, str):
                  block = blockquote(value)
                  if block:
                      blocks.append(block)

          print('\n\n'.join(blocks))
          print('\n\n## Surfaces\n- `**`\n\n## Out of Scope\n- (none)\n')
          PY

          issue_number="$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --search "${BOOTSTRAP_TITLE} in:title" \
            --json number \
            --jq '.[0].number // empty')"
          if [ -z "$issue_number" ]; then
            issue_url="$(gh issue create \
              --repo "$REPOSITORY" \
              --title "$BOOTSTRAP_TITLE" \
              --label slice \
              --body-file bootstrap_issue.md)"
            issue_number="${issue_url##*/}"
          fi

          printf 'Closes #%s\n' "$issue_number" > bootstrap_pr.md
          pr_url="$(gh pr create \
            --repo "$REPOSITORY" \
            --base master \
            --head "$BOOTSTRAP_BRANCH" \
            --title "$BOOTSTRAP_TITLE" \
            --body-file bootstrap_pr.md)"
          echo "Bootstrap PR: $pr_url"

          {
            echo "## Seed specialization prepared"
            echo "Review [$pr_url]($pr_url), activate the reviewed controls using SETUP.md, then complete required reviews and checks before merge."
            echo "This workflow does not apply live rulesets, replace labels, or merge the PR."
          } >> "$GITHUB_STEP_SUMMARY"
