name: Protocol and receipt fuzzing

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '15 2 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol_fuzzing:
    name: Protocol and receipt fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install locked runtime and fuzz engine
        run: |
          python -m pip install --require-hashes -r requirements/ci/runtime-env.txt
          python -m pip install --require-hashes -r requirements/ci/build-tools.txt
          python -m pip install --only-binary=:all: --require-hashes -r requirements/ci/fuzz-env.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Fuzz bounded protocols and saved receipts
        run: |
          mkdir -p fuzz-evidence/corpus
          cp fuzz/corpus/* fuzz-evidence/corpus/
          python fuzz/fuzz_protocol.py --evidence fuzz-evidence/outcomes.json \
            fuzz-evidence/corpus -seed=42 -atheris_runs=10000 -max_len=4096 \
            -timeout=5 -rss_limit_mb=512 -artifact_prefix=fuzz-evidence/crash-

      - name: Retain fuzz outcomes and crashing inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: protocol-fuzz-evidence
          path: fuzz-evidence
          if-no-files-found: error
          retention-days: 14
