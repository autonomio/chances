name: Protocol and receipt fuzzing

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '15 2 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protocol_fuzzing:
    name: Protocol and receipt fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install locked runtime and fuzz engine
        env:
          PIP_ONLY_BINARY: ":all:"
        run: |
          python -m pip install --require-hashes -r requirements/ci/runtime-env.txt
          python -m pip install --require-hashes -r requirements/ci/build-tools.txt
          python -m pip install --require-hashes -r requirements/ci/fuzz-env.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Fuzz bounded protocols and saved receipts
        run: |
          mkdir -p fuzz-evidence/corpus
          cp fuzz/corpus/* fuzz-evidence/corpus/
          python fuzz/fuzz_protocol.py --evidence fuzz-evidence/outcomes.json \
            fuzz-evidence/corpus -seed=42 -atheris_runs=10000 -max_len=4096 \
            -timeout=5 -rss_limit_mb=512 -artifact_prefix=fuzz-evidence/crash-

      - name: Retain fuzz outcomes and crashing inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: protocol-fuzz-evidence
          path: fuzz-evidence
          if-no-files-found: error
          retention-days: 14
