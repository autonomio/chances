name: Approved Release

# Manual only. The release environment must require operator approval and
# restrict deployment to master; SETUP.md describes activation.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact MAJOR.MINOR.PATCH from pyproject.toml and the newest changelog section.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: approved-release
  cancel-in-progress: false

jobs:
  post_release:
    name: post_release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Require approved default-branch dispatch
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          test "$RELEASE_REF" = 'refs/heads/master' || { echo '::error::Release requires master.'; exit 1; }
          test "$RELEASE_ENABLED" = 'true' || { echo '::error::Activate the protected release environment and set RELEASE_ENABLED=true.'; exit 1; }

      - name: Checkout approved commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install release toolchain
        run: python -m pip install --require-hashes -r requirements/ci/gate-tools.txt

      - name: Validate requested version and release source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          requested = os.environ['REQUESTED_VERSION']
          if not re.fullmatch(r'\d+\.\d+\.\d+', requested) or requested != version:
              raise SystemExit('Requested release version must equal the project version.')
          from scripts.create_release import newest_changelog_section
          if not newest_changelog_section(version):
              raise SystemExit('The matching newest changelog section must contain release notes.')
          PY
          remote_master=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          test "$remote_master" = "$GITHUB_SHA" || { echo '::error::Master advanced after this dispatch; review and dispatch again.'; exit 1; }

      - name: Archive complete approved source
        id: source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/chances-$REQUESTED_VERSION-source.tar.gz"
          python scripts/release_assets.py archive --output "$archive"
          printf 'path=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Attest complete source
        id: source_attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a  # v3.0.0
        with:
          subject-path: ${{ steps.source.outputs.path }}

      - name: Verify source signing identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_ARCHIVE: ${{ steps.source.outputs.path }}
          SOURCE_BUNDLE: ${{ steps.source_attestation.outputs.bundle-path }}
        run: |
          gh attestation verify "$SOURCE_ARCHIVE" --bundle "$SOURCE_BUNDLE" \
            --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/master --deny-self-hosted-runners \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/pr_post_release.yml"

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Create the approved tag and release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$AUTH"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="$AUTH"
          git -c "http.https://github.com/.extraheader=$AUTH" fetch origin master --tags
          python scripts/create_release.py

      - name: Publish immutable source and signature bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_ARCHIVE: ${{ steps.source.outputs.path }}
          SOURCE_BUNDLE: ${{ steps.source_attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sigstore.json"
          cp "$SOURCE_BUNDLE" "$bundle"
          python scripts/release_assets.py upload --tag "v$REQUESTED_VERSION" --assets "$SOURCE_ARCHIVE" "$bundle"
